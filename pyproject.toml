[project]
name = "timescape"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vicente Pedreros", email = "vicente.pedreros@hdr.qut.edu.au" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "scienceplots>=2.2.2",
    "scipy>=1.17.1",
]

[project.scripts]
timescape = "timescape:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
